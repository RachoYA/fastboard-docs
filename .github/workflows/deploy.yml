name: Deploy

# Деплой на сервер консультанта. Секреты репозитория:
#   DEPLOY_HOST    — адрес сервера
#   DEPLOY_USER    — пользователь SSH
#   DEPLOY_SSH_KEY — приватный ключ деплоя (публичный лежит в ~/.ssh/authorized_keys на сервере)
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Развернуть
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash -s' < deploy/remote_deploy.sh
