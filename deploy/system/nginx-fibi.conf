# API виджета Фиби. Ставит deploy/system/install.sh, подставляя домен вместо __DOMAIN__.
# Приложение слушает только 127.0.0.1:8080 (deploy/system/fastboard-web.service).

# Сайт подключается внутри http {}, поэтому зоны лимитов можно объявить здесь.
# Каждый вопрос из браузера — это предзапрос OPTIONS и сам POST, то есть два запроса.
limit_req_zone $binary_remote_addr zone=fibi_chat:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=fibi_handoff:1m rate=4r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    # Редирект внутри location, а не на уровне server: так certbot при продлении
    # может вставить свою точную location для проверки домена
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Вопрос с историей диалога занимает единицы килобайт. Без предела один запрос
    # мог бы загрузить в модель сотни килобайт и надолго занять общую очередь к GPU.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Заменяем заголовок, а не дописываем к присланному: приложение берёт первый
    # адрес из списка, и подставленный клиентом адрес обходил бы лимит запросов.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /chat/stream {
        limit_req zone=fibi_chat burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        # Ответ идёт потоком (SSE): без буферизации и с запасом на очередь к GPU
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /chat/handoff {
        limit_req zone=fibi_handoff burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 30s;
    }
}
